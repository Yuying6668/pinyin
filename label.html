<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>YY pinyin · 录音对号</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F1E9;--card:#fff;--line:#E7DFD3;--line2:#D9CFC0;--ink:#1F2A44;--ink2:#4A5468;--muted:#8A8376;--terra:#D9734E;--terra-t:#F6E2D8;--sage-d:#5F7F65;--sage-t:#E3EBE2;--mustard:#E3B23C}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',sans-serif}
.py{font-family:'Andika',sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:1.4rem}
h1{font-size:1.5rem;margin:.2rem 0 .4rem}
.help{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.2rem;font-size:.95rem;line-height:1.7;color:var(--ink2)}
.help b{color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:rgba(246,241,233,.95);backdrop-filter:blur(6px);padding:.7rem 0;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:.8rem}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:.35rem .7rem}
.pri{background:var(--terra);color:#fff;border-color:var(--terra);font-weight:700}
.row{display:grid;grid-template-columns:4.6rem 9.5rem 8rem 1fr;gap:.6rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.55rem .7rem;margin-bottom:.45rem}
.row.cur{border:2px solid var(--terra)}
.row.done{background:#fbfaf6}
.row.skip{opacity:.45}
.play{font-weight:700;width:100%}
.types button{padding:.3rem .5rem;font-size:.85rem}
.types button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
select{font:inherit;font-family:'Andika',sans-serif;font-size:1.15rem;padding:.25rem .4rem;border-radius:10px;border:1px solid var(--line2);background:var(--card);width:100%}
.tones{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
.tones button{font-family:'Andika',sans-serif;font-size:1.25rem;min-width:3.4rem}
.tones button.on{background:var(--sage-d);color:#fff;border-color:var(--sage-d)}
.tones input{font:inherit;font-size:1rem;padding:.3rem .5rem;border-radius:10px;border:1px solid var(--line2);width:9rem}
.dur{font-size:.72rem;color:var(--muted);text-align:center}
.prog{font-weight:700}
textarea{width:100%;height:9rem;font-family:monospace;font-size:.8rem;border-radius:12px;border:1px solid var(--line2);padding:.6rem;margin-top:.6rem}
.ok{color:var(--sage-d);font-weight:700}
@media(max-width:760px){.row{grid-template-columns:4rem 1fr}.row>.tones{grid-column:1/-1}}
</style>
</head>
<body><div class="wrap">
<h1>录音对号 · Gkhjqx 两拼拼读</h1>
<div class="help">
  录音已经按停顿切成 <b id="n"></b> 段。每一段：<b>① 点 ▶ 听</b> → <b>② 选类型</b>（音节 / 例词 / 不要）→ <b>③ 选音节和声调</b>，如果是例词，确认一下词语。<br>
  我已经<b>预先猜好</b>：声调是电脑按音高猜的，长一点的段落猜成"例词"，音节默认沿用上一段。<b>改了某一段的音节，后面没改过的段落会自动跟着变</b>，所以通常只需要在换音节的地方改一下。<br>
  快捷键：<b>空格</b> 播放当前段，<b>↓ / 回车</b> 下一段并播放，<b>1–4</b> 选声调。全部看完后点 <b>"完成，复制结果"</b>，把结果粘贴回聊天里给我。
</div>
<div class="bar"><span class="prog" id="prog"></span><button id="playall">▶ 从当前段连续播放</button><button id="stop">■ 停</button>
  <span style="margin-left:auto"></span><button class="pri" id="done">完成，复制结果</button></div>
<div id="list"></div>
<div id="outbox" style="display:none"><p class="ok" id="okmsg"></p><textarea id="out" readonly></textarea></div>
</div>
<script src="data.js"></script>
<script>
(async function(){
  const SYLS=['ga','ge','gu','ka','ke','ku','ha','he','hu','ji','ju','qi','qu','xi','xu','a','o','e','i','u','ü'];
  const key=s=>({ju:'jv',qu:'qv',xu:'xv','ü':'v'}[s]||s);
  const MARK={a:'āáǎà',o:'ōóǒò',e:'ēéěè',i:'īíǐì',u:'ūúǔù','ü':'ǖǘǚǜ'};
  const mark=(s,t)=>{const m=s.match(/[aoeiuü]/);return m?s.replace(m[0],MARK[m[0]][t-1]):s;};
  const clips=await fetch('audio/raw/clips.json').then(r=>r.json());
  let saved={};try{saved=JSON.parse(localStorage.getItem('yy-label')||'{}')}catch(e){}
  let prevS='ga';
  const rows=clips.map(c=>{
    const sv=saved[c.id];
    if(sv) {prevS=sv.syl;return sv;}
    const r={id:c.id,file:c.file,dur:c.dur,type:c.dur>=1.25?'word':'syl',syl:prevS,tone:c.tone||1,word:'',touched:false,checked:false};
    return r;
  });
  rows.forEach(r=>{if(!r.word&&r.type==='word'){const ex=EX[key(r.syl)+r.tone];r.word=ex?ex[0]:'';}});
  document.getElementById('n').textContent=rows.length;
  let cur=0; const audio=new Audio(); let chain=false;
  const save=()=>{try{const o={};rows.forEach(r=>o[r.id]=r);localStorage.setItem('yy-label',JSON.stringify(o))}catch(e){}};
  function render(){
    const L=document.getElementById('list');
    L.innerHTML=rows.map((r,i)=>`<div class="row ${i===cur?'cur':''} ${r.checked?'done':''} ${r.type==='skip'?'skip':''}" data-i="${i}">
      <div><button class="play" data-a="play">▶ ${String(r.id).padStart(3,'0')}</button><div class="dur">${r.dur}s</div></div>
      <div class="types">${[['syl','音节'],['word','例词'],['skip','不要']].map(([t,n])=>`<button data-a="type" data-v="${t}" class="${r.type===t?'on':''}">${n}</button>`).join('')}</div>
      <div><select data-a="syl">${SYLS.map(s=>`<option ${s===r.syl?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="tones">${[1,2,3,4].map(t=>`<button data-a="tone" data-v="${t}" class="${r.tone===t?'on':''}">${mark(r.syl,t)}</button>`).join('')}
        ${r.type==='word'?`<input data-a="word" value="${r.word}" placeholder="例词，如 鸽子">`:''}</div></div>`).join('');
    document.getElementById('prog').textContent=`已确认 ${rows.filter(r=>r.checked).length} / ${rows.length}`;
  }
  function play(i){cur=i;audio.src='audio/raw/'+rows[i].file;audio.play();rows[i].checked=true;save();render();
    const el=document.querySelector(`.row[data-i="${i}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});}
  function propagate(i){for(let j=i+1;j<rows.length&&!rows[j].touched;j++){rows[j].syl=rows[i].syl;
    if(rows[j].type==='word'){const ex=EX[key(rows[j].syl)+rows[j].tone];rows[j].word=ex?ex[0]:'';}}}
  audio.onended=()=>{if(chain&&cur<rows.length-1)setTimeout(()=>play(cur+1),500);};
  document.getElementById('list').addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');const row=e.target.closest('.row');if(!row)return;const i=+row.dataset.i,r=rows[i];
    if(!b){cur=i;render();return;}
    const a=b.dataset.a;
    if(a==='play'){chain=false;play(i);return;}
    if(a==='type'){r.type=b.dataset.v;r.touched=true;if(r.type==='word'&&!r.word){const ex=EX[key(r.syl)+r.tone];r.word=ex?ex[0]:'';}}
    if(a==='tone'){r.tone=+b.dataset.v;r.touched=true;if(r.type==='word'){const ex=EX[key(r.syl)+r.tone];if(ex)r.word=ex[0];}}
    r.checked=true;cur=i;save();render();
  });
  document.getElementById('list').addEventListener('change',e=>{
    const row=e.target.closest('.row');const i=+row.dataset.i,r=rows[i];
    if(e.target.dataset.a==='syl'){r.syl=e.target.value;r.touched=true;propagate(i);}
    if(e.target.dataset.a==='word'){r.word=e.target.value.trim();r.touched=true;}
    r.checked=true;cur=i;save();render();
  });
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    if(e.key===' '){e.preventDefault();play(cur);}
    if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();if(cur<rows.length-1)play(cur+1);}
    if(e.key==='ArrowUp'){e.preventDefault();if(cur>0)play(cur-1);}
    if('1234'.includes(e.key)&&e.key.length===1){rows[cur].tone=+e.key;rows[cur].touched=true;rows[cur].checked=true;save();render();}
  });
  document.getElementById('playall').onclick=()=>{chain=true;play(cur);};
  document.getElementById('stop').onclick=()=>{chain=false;audio.pause();};
  document.getElementById('done').onclick=async()=>{
    const res=rows.map(r=>r.type==='skip'?[r.id,'skip']:[r.id,r.type,key(r.syl),r.tone,r.type==='word'?r.word:'']);
    const txt='YYLABEL'+JSON.stringify(res);
    const box=document.getElementById('outbox');box.style.display='block';document.getElementById('out').value=txt;
    try{await navigator.clipboard.writeText(txt);document.getElementById('okmsg').textContent='已复制！直接粘贴到聊天里发给我就行。';}
    catch(e){document.getElementById('okmsg').textContent='请全选下面的文字，复制后粘贴到聊天里发给我。';}
    box.scrollIntoView({behavior:'smooth'});
  };
  render();
})();
</script>
</body>
</html>
